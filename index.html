<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quét Biển Số Xe</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #121212; color: #fff; text-align: center; }
    h2 { margin: 8px 0; font-size: 18px; color: #00E676; }
    .camera-box { position: relative; width: 100%; max-height: 40vh; border-radius: 12px; overflow: hidden; border: 2px solid #00E676; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan-guide { position: absolute; top: 20%; left: 15%; width: 70%; height: 60%; border: 2px dashed rgba(0, 230, 118, 0.8); border-radius: 8px; pointer-events: none; }
    .status { margin-top: 8px; font-size: 14px; font-weight: bold; color: #FFD54F; }
    .debug { margin-top: 4px; font-size: 12px; color: #888; min-height: 18px; }
    .btn-manual { margin-top: 10px; background: #00E676; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; }
    .log-box { margin-top: 12px; max-height: 180px; overflow-y: auto; text-align: left; background: #1E1E1E; padding: 10px; border-radius: 8px; border: 1px solid #333; }
    .log-item { padding: 6px 0; border-bottom: 1px solid #2C2C2C; font-size: 13px; color: #E0E0E0; }
    .log-item b { color: #00E676; }
  </style>
</head>
<body>

  <h2>HỆ THỐNG QUÉT BIỂN SỐ XE</h2>
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-guide"></div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="status" id="status">Đang nạp mô hình nhận diện...</div>
  <div class="debug" id="debug">Đang chờ khung hình...</div>

  <button class="btn-manual" onclick="triggerScan()">BẤM ĐỌC BIỂN SỐ NGAY</button>

  <div class="log-box" id="logBox">
    <div style="color: #888; font-size: 12px;">Biển số ghi nhận sẽ hiển thị ở đây...</div>
  </div>

  <script>
    // =============================================================
    // DÁN LINK APPS SCRIPT CỦA ANH VÀO DÒNG DƯỚI ĐÂY:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzc0u4q6q-hqHztM4dDUnpOrC7W76NES5OOiP4XplantWX2TZ1q1lCdDlhss1JYAh-q/exec";
    // =============================================================

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    const debugText = document.getElementById('debug');
    const logBox = document.getElementById('logBox');

    let scannedPlates = new Set();
    let isProcessing = false;
    let worker = null;

    // Khởi tạo Tesseract OCR
    async function initOCR() {
      try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.-'
        });
        statusText.innerText = "Sẵn sàng. Hãy đưa biển số vào ô nét đứt!";
        setInterval(autoScan, 1500);
      } catch (err) {
        statusText.innerText = "Lỗi tải thư viện: " + err.message;
      }
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(stream => {
      video.srcObject = stream;
      initOCR();
    }).catch(err => {
      statusText.innerText = "Lỗi mở camera: " + err.message;
    });

    function triggerScan() {
      autoScan(true);
    }

    async function autoScan(isManual = false) {
      if (isProcessing || !worker || video.readyState !== 4) return;
      isProcessing = true;
      if (isManual) statusText.innerText = "Đang phân tích...";

      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      
      // Xử lý cắt vùng nét đứt ở giữa màn hình để tối ưu nhận dạng
      const cropX = canvas.width * 0.15;
      const cropY = canvas.height * 0.20;
      const cropW = canvas.width * 0.70;
      const cropH = canvas.height * 0.60;

      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      try {
        const { data: { text } } = await worker.recognize(canvas);
        let raw = text.replace(/[^A-Z0-9\n]/g, '').trim();
        debugText.innerText = "Camera thấy: " + text.replace(/\n/g, ' | ').substring(0, 40);

        // Thuật toán gộp dòng 1 và dòng 2 của biển xe máy
        let lines = text.split('\n').map(l => l.replace(/[^A-Z0-9]/g, '')).filter(l => l.length >= 2);
        let candidatePlate = "";

        if (lines.length >= 2) {
          // Biển xe máy 2 dòng (ví dụ 50AD ở dòng 1 và 87921 ở dòng 2)
          candidatePlate = lines[0] + lines[1];
        } else if (lines.length === 1) {
          // Biển ô tô 1 dòng
          candidatePlate = lines[0];
        }

        if (candidatePlate.length >= 7 && candidatePlate.length <= 10) {
          if (!scannedPlates.has(candidatePlate)) {
            scannedPlates.add(candidatePlate);
            statusText.innerText = "✔ Nhận diện thành công: " + candidatePlate;
            pushToSheet(candidatePlate);
          }
        }
      } catch (e) {
        console.log(e);
      } finally {
        isProcessing = false;
      }
    }

    function pushToSheet(plate) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bienSo: plate })
      }).then(() => {
        const row = document.createElement('div');
        row.className = 'log-item';
        row.innerHTML = `✔ Đã lưu Sheet: <b>${plate}</b> - <i>${new Date().toLocaleTimeString()}</i>`;
        logBox.prepend(row);
      });
    }
  </script>
</body>
</html>
